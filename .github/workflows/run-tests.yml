name: run-tests
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message }} · ${{ github.actor }}

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun test
